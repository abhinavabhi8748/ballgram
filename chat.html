<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballgram AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 400px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .user {
            background: #e8f0fe;
            text-align: right;
        }

        .ai {
            background: #f1f1f1;
        }

        #inputArea {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>⚽ Ballgram AI 🤖</h1>

    <div id="chat"></div>

    <div id="inputArea">
        <input id="messageInput" type="text" placeholder="Ask Ballgram AI..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `
                <div class="message user">
                    ${message}
                </div>
            `;

            input.value = "";

            try {
                const response = await fetch("http://localhost:3000/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

               const reader = response.body.getReader();
const decoder = new TextDecoder();

let aiMessage = "";

chat.innerHTML += `
    <div class="message ai" id="currentAI">
    </div>
`;

const aiBox = document.getElementById("currentAI");

while (true) {
    const { value, done } = await reader.read();

    if (done) break;

    const text = decoder.decode(value, { stream: true });

    aiMessage += text;
    aiBox.textContent = aiMessage;
}

            } catch (error) {
                chat.innerHTML += `
                    <div class="message ai">
                        ❌ Could not connect to Ballgram AI.
                    </div>
                `;
            }
        }
    </script>

</body>
</html>
